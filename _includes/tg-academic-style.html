<style>
  .tg-page {
    --tg-ink: #1f2429;
    --tg-muted: #5f6975;
    --tg-soft: #f6f7f4;
    --tg-line: var(--global-divider-color, #dfe4e8);
    --tg-accent: #176b63;
    --tg-accent-2: #9a6a2f;
    color: var(--tg-ink);
    font-size: 1rem;
    line-height: 1.68;
    margin: 0 auto 4.5rem;
    max-width: 980px;
  }

  .tg-page a {
    text-decoration-thickness: 1px;
    text-underline-offset: 0.2em;
  }

  .tg-page h1,
  .tg-page h2,
  .tg-page h3,
  .tg-page p {
    letter-spacing: 0;
  }

  .tg-page h2 {
    color: var(--tg-ink);
    font-size: 1.34rem;
    font-weight: 720;
    line-height: 1.25;
    margin: 0;
  }

  .tg-kicker {
    color: var(--tg-accent);
    font-size: 0.86rem;
    font-weight: 700;
    margin-bottom: 0.35rem;
  }

  .tg-muted {
    color: var(--tg-muted);
  }

  .tg-hero {
    align-items: center;
    border-bottom: 1px solid var(--tg-line);
    display: grid;
    gap: 2.8rem;
    grid-template-columns: minmax(0, 1fr) 260px;
    padding: 2.6rem 0 2.5rem;
  }

  .tg-hero-name {
    color: var(--tg-ink);
    font-size: 3.05rem;
    font-weight: 800;
    line-height: 1.03;
    margin: 0 0 0.35rem;
  }

  .tg-hero-local-name {
    color: var(--tg-accent-2);
    font-size: 1.04rem;
    font-weight: 700;
    margin: 0 0 0.65rem;
  }

  .tg-hero-role {
    color: var(--tg-muted);
    font-size: 1.08rem;
    line-height: 1.5;
    margin: 0 0 1.25rem;
  }

  .tg-hero-summary {
    font-size: 1.08rem;
    line-height: 1.75;
    margin: 0;
    max-width: 42rem;
  }

  .tg-hero-media {
    justify-self: end;
  }

  .tg-portrait {
    aspect-ratio: 4 / 5;
    border: 1px solid var(--tg-line);
    border-radius: 8px;
    box-shadow: 0 16px 34px rgba(31, 36, 41, 0.14);
    display: block;
    object-fit: cover;
    object-position: 50% 50%;
    width: 250px;
  }

  .tg-links {
    display: flex;
    flex-wrap: wrap;
    gap: 0.55rem 1.1rem;
    margin-top: 1.35rem;
  }

  .tg-links a {
    color: var(--tg-ink);
    font-size: 0.95rem;
    font-weight: 650;
    text-decoration-color: rgba(23, 107, 99, 0.35);
  }

  .tg-links a:hover {
    color: var(--tg-accent);
  }

  .tg-section {
    margin-top: 3rem;
  }

  .tg-page > .tg-section:first-child {
    margin-top: 1rem;
  }

  .tg-section-head {
    align-items: end;
    border-bottom: 1px solid var(--tg-line);
    display: flex;
    gap: 1rem;
    justify-content: space-between;
    margin-bottom: 1.15rem;
    padding-bottom: 0.65rem;
  }

  .tg-section-note {
    color: var(--tg-muted);
    font-size: 0.92rem;
    margin: 0;
  }

  .tg-feed-wrap {
    border: 1px solid var(--tg-line);
    border-radius: 8px;
    overflow: hidden;
  }

  .tg-feed-toolbar {
    align-items: center;
    background: var(--tg-soft);
    border-bottom: 1px solid var(--tg-line);
    display: flex;
    justify-content: space-between;
    padding: 0.7rem 0.9rem;
  }

  .tg-feed-toolbar span {
    color: var(--tg-muted);
    font-size: 0.88rem;
  }

  .tg-feed {
    display: grid;
    gap: 0.85rem;
    max-height: 35rem;
    overflow-y: auto;
    padding: 0.9rem;
    scroll-snap-type: y proximity;
  }

  .tg-feed:focus {
    outline: 2px solid var(--tg-accent);
    outline-offset: -2px;
  }

  .tg-feed::-webkit-scrollbar {
    width: 0.7rem;
  }

  .tg-feed::-webkit-scrollbar-thumb {
    background: rgba(31, 36, 41, 0.24);
    border: 3px solid transparent;
    border-radius: 8px;
    background-clip: padding-box;
  }

  .tg-work-card {
    background: var(--global-bg-color, #fff);
    border: 1px solid var(--tg-line);
    border-radius: 8px;
    display: grid;
    gap: 1rem;
    grid-template-columns: 180px minmax(0, 1fr);
    padding: 0.8rem;
    scroll-snap-align: start;
  }

  .tg-work-card:hover {
    border-color: rgba(23, 107, 99, 0.45);
    box-shadow: 0 12px 26px rgba(31, 36, 41, 0.08);
  }

  .tg-work-card img {
    aspect-ratio: 4 / 3;
    border: 1px solid var(--tg-line);
    border-radius: 6px;
    height: 100%;
    object-fit: cover;
    width: 100%;
  }

  .tg-work-title {
    color: var(--tg-ink);
    font-size: 1.05rem;
    font-weight: 720;
    line-height: 1.35;
    margin: 0 0 0.4rem;
  }

  .tg-work-title a {
    color: inherit;
    text-decoration-color: rgba(23, 107, 99, 0.35);
  }

  .tg-work-meta {
    color: var(--tg-muted);
    font-size: 0.92rem;
    line-height: 1.5;
    margin: 0;
  }

  .tg-publication-list {
    counter-reset: tg-item;
    list-style: none;
    margin: 0;
    padding: 0;
  }

  .tg-publication-item {
    border-top: 1px solid var(--tg-line);
    counter-increment: tg-item;
    display: grid;
    gap: 0.75rem;
    grid-template-columns: 2.55rem minmax(0, 1fr);
    padding: 1.05rem 0;
  }

  .tg-publication-item:last-child {
    border-bottom: 1px solid var(--tg-line);
  }

  .tg-publication-item::before {
    color: var(--tg-accent-2);
    content: counter(tg-item, decimal-leading-zero);
    font-size: 0.8rem;
    font-weight: 760;
    padding-top: 0.15rem;
  }

  .tg-publication-title,
  .tg-cv-title {
    color: var(--tg-ink);
    font-size: 1rem;
    font-weight: 700;
    line-height: 1.42;
    margin: 0;
  }

  .tg-publication-meta,
  .tg-publication-doi,
  .tg-cv-meta,
  .tg-cv-note {
    color: var(--tg-muted);
    font-size: 0.92rem;
    line-height: 1.52;
    margin: 0.25rem 0 0;
  }

  .tg-publication-doi a {
    color: var(--tg-accent);
  }

  .tg-cv-lead {
    border-bottom: 1px solid var(--tg-line);
    padding: 0.3rem 0 1.4rem;
  }

  .tg-cv-lead p {
    font-size: 1.05rem;
    margin: 0;
    max-width: 46rem;
  }

  .tg-cv-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 0.7rem 1rem;
    margin-top: 0.9rem;
  }

  .tg-cv-actions a {
    color: var(--tg-ink);
    font-size: 0.92rem;
    font-weight: 650;
  }

  .tg-cv-section {
    margin-top: 2.45rem;
  }

  .tg-cv-item {
    border-top: 1px solid var(--tg-line);
    display: grid;
    gap: 0.5rem 1.1rem;
    grid-template-columns: 9.5rem minmax(0, 1fr);
    padding: 0.9rem 0;
  }

  .tg-cv-item:first-of-type {
    border-top: 0;
    padding-top: 0;
  }

  .tg-section-head + .tg-cv-item,
  .tg-section-head + .tg-publication-list > .tg-publication-item:first-child {
    border-top: 0;
    padding-top: 0;
  }

  .tg-cv-date {
    color: var(--tg-accent-2);
    font-size: 0.88rem;
    font-weight: 700;
  }

  .tg-cv-list {
    margin: 0;
    padding-left: 1.1rem;
  }

  .tg-cv-list li {
    margin-bottom: 0.45rem;
  }

  .tg-cv-skills {
    display: grid;
    gap: 0.75rem 1rem;
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .tg-cv-skills div {
    border-top: 1px solid var(--tg-line);
    padding-top: 0.7rem;
  }

  .tg-cv-skills strong {
    color: var(--tg-ink);
  }

  html[data-theme='dark'] .tg-page {
    --tg-ink: #f4f6f6;
    --tg-muted: #b8c0c7;
    --tg-soft: #181b1e;
    --tg-line: #30363d;
    --tg-accent: #6fc2b7;
    --tg-accent-2: #d1a36a;
  }

  html[data-theme='dark'] .tg-work-card {
    background: #111315;
  }

  @media (max-width: 820px) {
    .tg-hero {
      gap: 1.5rem;
      grid-template-columns: 1fr;
      padding-top: 1.8rem;
    }

    .tg-hero-media {
      justify-self: start;
      order: -1;
    }

    .tg-hero-name {
      font-size: 2.35rem;
    }

    .tg-portrait {
      width: 190px;
    }

    .tg-cv-skills {
      grid-template-columns: 1fr;
    }

    .tg-section-head {
      align-items: start;
      flex-direction: column;
    }

    .tg-work-card {
      grid-template-columns: 1fr;
    }

    .tg-work-card img {
      max-height: 14rem;
    }

    .tg-publication-item,
    .tg-cv-item {
      grid-template-columns: 1fr;
    }
  }
</style>
